# Reverse proxy + static file server for the salesflow-prod compose
# project. TLS/certificates are deliberately not configured here —
# docs/06-architecture.md doesn't specify a cert strategy, so this
# listens on plain HTTP (80) only. Put a TLS-terminating layer in front
# of this (or add a 443 server block + certs yourself) before exposing
# it publicly; until then, keep SECURE_SSL_REDIRECT=False in .env or
# every request will redirect to an HTTPS endpoint that doesn't exist.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # STATIC_ROOT (config/settings/base.py) is collected into this
    # shared volume by the web container's entrypoint on every start —
    # nginx serves it directly instead of proxying static requests
    # through gunicorn/Django.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required so Django's SECURE_PROXY_SSL_HEADER (config/settings/
        # prod.py) can tell a real HTTPS request apart from plain HTTP,
        # once/if you add a 443 server block terminating TLS above this.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
