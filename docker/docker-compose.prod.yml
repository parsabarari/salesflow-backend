# Production-oriented compose file (docs/06-architecture.md §6).
# Differs from docker-compose.yml (dev) in three ways:
#   1. Builds with requirements/prod.txt (gunicorn, not runserver/debug-toolbar)
#   2. No bind-mount of source — the image is self-contained, rebuilt on deploy
#   3. No MinIO — §2 is explicit that production points django-storages at
#      real AWS S3 via .env values, "same codebase, no compose file change
#      needed." Adding a MinIO service here would contradict that.
#
# Postgres/Redis default to EXTERNAL managed services (RDS, ElastiCache,
# Redis Cloud, etc.) via DATABASE_URL / REDIS_URL in .env — §6 doesn't
# mandate self-hosting them, and treating a container + local Docker
# volume as "the production database" is fragile (dies with the host,
# doesn't survive a redeploy). If you want to self-host them instead,
# uncomment the `postgres` and `redis` services at the bottom and set
# POSTGRES_HOST=postgres / REDIS_URL=redis://redis:6379/0 (etc.) in .env
# to match — this repo doesn't take a position on which is correct,
# since docs/06-architecture.md doesn't resolve it either.
#
# `web` is the only horizontally-scalable service (§6 table). Plain
# `docker compose` isn't itself a production orchestrator — there's no
# rolling-deploy/health-based rescheduling here. Scale it manually with:
#   docker compose -f docker/docker-compose.prod.yml up -d --scale web=3
# and put a load balancer in front, or hand this file's service
# definitions to whatever orchestrator (Swarm/K8s/ECS) you deploy with.
# Choosing that orchestrator is outside docs/06-architecture.md's scope.

name: salesflow-prod

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    env_file: ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    volumes:
      - static_volume:/app/staticfiles
    # No host port published — nginx is now the single entry point.
    # Still reachable from other containers on the compose network at
    # web:8000 (used by nginx's proxy_pass above).
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - static_volume:/app/staticfiles:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - web

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config worker -l info
    env_file: ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config beat -l info
    env_file: ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    restart: unless-stopped
    # Deliberately never scale this service — docs/06-architecture.md §6:
    # running more than one Beat process double-fires scheduled jobs.
    # Compose alone won't stop someone passing --scale beat=2, so this
    # is a documented convention, not an enforced one, same caveat as
    # the dev compose file's identical `deploy.replicas: 1` below.
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

# --- OPTIONAL: self-hosted Postgres/Redis ---
# Uncomment below (and the `volumes:` block at the bottom of this file)
# if you're intentionally NOT using managed Postgres/Redis. Also update
# .env: POSTGRES_HOST=postgres, DATABASE_URL=postgres://.../postgres:5432/...,
# REDIS_URL=redis://redis:6379/0, CELERY_BROKER_URL=redis://redis:6379/1,
# CELERY_RESULT_BACKEND=redis://redis:6379/2.

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  static_volume:
